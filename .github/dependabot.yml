# Dependabot: weekly dependency updates for the adapter's npm tooling and its GitHub Actions. The fleet policy is D41 (grouped weekly updates, minor and patch
# merged after CI) and D52 (declined majors as ignore rules), both in the workspace's docs/audit/LENS_GROUNDING_LOG.md. This is a library, not an app, so it
# does not use the app template (frontend-config's templates/dependabot.app.yml). The Mysten SDK packages are peers, not dependencies: consumers choose them.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Few open pull requests at once: the groups below normally make it one or two a week.
    open-pull-requests-limit: 5
    ignore:
      # Playwright 1.65.x ships a Firefox build that crashes pages when getByRole/getByLabel follow an axe scan
      # (microsoft/playwright#43967, #44135; fixed in Firefox r1575, not in a 1.65 release). Remove with the 1.66 move (D147, FU-0152).
      - dependency-name: "@playwright/test"
        versions: ["1.65.x"]
      # TypeScript majors are adopted deliberately, fleet-wide, not by a bot (D52; TypeScript 7 is the next one).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates arrive as one pull request, merged once CI passes (D41).
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Actions are pinned by full commit SHA (D12); one pull request moves every pin together.
      github-actions:
        patterns: ['*']
